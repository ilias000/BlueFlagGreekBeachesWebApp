# Port that the application will run.
server.port=8080

# Spring Datasource Properties.
# With update Hibernate changes the database according to the given entity structures. (none: No change is made to the database structure.)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/BlueFlagGreekBeaches
spring.datasource.username=admin
spring.datasource.password=Adminpass@123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Used to remove warning.
# OSIV affects the connection and performance of the database.
# Database performance should be tested and taken care in production environment.
spring.jpa.open-in-view=true

# Outgoing mail (Gmail SMTP). Spring Boot builds the JavaMailSender from these settings.
# The account and its app password are read from the environment so they never appear in the repository:
#   MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=your-app-password ./gradlew bootRun
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The RSA key pair that signs the JWTs is generated at startup (see SecurityConfig); no key files are needed.
